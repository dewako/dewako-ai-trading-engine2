[project]
name = "dewako"
version = "0.1.0"
description = "DEWAKO AI Trading Engine backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dewako*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
