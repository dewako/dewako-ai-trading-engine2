[project]
name = "dewako"
version = "0.1.0"
description = "DEWAKO AI Trading Engine backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.1",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.setuptools.packages.find]
include = ["dewako*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
