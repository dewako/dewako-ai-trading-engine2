# Dependency update proposals. Each update arrives as a pull request and must pass ci + security before a human merges it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/backend"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/backend"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
