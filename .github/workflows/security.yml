# Supply-chain and secret checks. Runs on every push and pull request, weekly (new advisories appear without code changes), and by hand.
# Findings fail the job. Accepted exceptions must be written down with a reason and an expiry (.grype.yaml, .gitleaks.toml) and
# approved by the owner; an exception is never added just to make the job green.
name: security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC
permissions: {contents: read}
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - run: pip install pip-audit==2.7.3
      - name: the exact pinned set CI tests with and the image installs (constraints-test.txt, includes test tools)
        run: pip-audit -r backend/constraints-test.txt --no-deps --desc
      - name: what a fresh, unconstrained install of the runtime requirements resolves to today
        run: pip-audit -r backend/requirements.txt --desc
  secrets-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {GITLEAKS_VERSION: "8.30.1"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}                 # the whole history, not just the latest commit
      - name: install gitleaks (release tarball verified against the release's checksum file)
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
      - name: scan every commit (secrets are redacted in the output and the report)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --report-format json --report-path gitleaks-report.json .
      - name: list findings by location only (rule, file, line, commit; never the value)
        if: failure()
        run: >-
          python3 -c "import json; [print(f['RuleID'], f['File'], 'line', f['StartLine'], f['Commit'][:12], f['Date'][:10])
          for f in json.load(open('gitleaks-report.json'))]"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: gitleaks-report, path: gitleaks-report.json, if-no-files-found: warn}
  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target production -t dewako-backend:scan backend
      - name: Python packages actually installed in the production image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pip dewako-backend:scan freeze > image-requirements.txt
          pip install pip-audit==2.7.3
          pip-audit -r image-requirements.txt --no-deps --desc
      - name: OS and package vulnerabilities in the production image (fails on high/critical with a fix available)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with: {image: "dewako-backend:scan", fail-build: true, severity-cutoff: high, only-fixed: true, output-format: table}
