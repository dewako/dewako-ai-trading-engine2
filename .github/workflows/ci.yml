# Core regression CI. Runs on every push and pull request, and by hand (workflow_dispatch).
# Every test job writes JUnit and keeps it as an artifact; scripts/assert_no_skips.py turns a failed, skipped (outside the stated
# allowance), missing or too-small run red. Required tests are listed once in .github/required-tests/ (shared by every job).
# Push and pull_request both run on purpose: the pull_request run tests the merge result with the base branch, the push run tests the
# branch head; skipping one can let a later "skipped" result stand in for a failed one. Superseded runs on the same ref are cancelled
# (never on main). Third-party actions are pinned to full commit SHAs (version in the comment; Dependabot proposes updates).
# Live trading stays LOCKED: no job has exchange credentials, and nothing here can enable live trading.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22"}
      - run: python -m compileall -q backend/dewako backend/tests scripts
      - run: pip install ruff==0.6.9
      - run: ruff check backend/dewako --select E9,F63,F7,F82      # real errors only: syntax, undefined names, invalid comparisons
      - run: python scripts/scan_secrets.py
      - name: the CI skip-policy script turns each kind of bad report red (self-test)
        run: python scripts/test_assert_no_skips.py
      - name: dashboard JavaScript parses (no build step exists; this is a syntax check, not a linter)
        run: |
          set -euo pipefail
          for f in frontend/prototype/*.js; do node --check "$f"; echo "ok $f"; done
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {python: ["3.12", "3.13"]}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - name: tests on SQLite (PostgreSQL-only tests are expected to skip here; HTTP and Node-based UI tests must run)
        working-directory: backend/tests
        env: {DEWAKO_REQUIRE_HTTP_TESTS: "1", DEWAKO_REQUIRE_NODE: "1", PYTHONPATH: ".."}
        run: python -m pytest -q -p no:cacheprovider --timeout=300 --junitxml=../../sqlite-junit-${{ matrix.python }}.xml
      - name: only PostgreSQL-only tests may be skipped; every shared required test must have run and passed
        run: >-
          python scripts/assert_no_skips.py sqlite-junit-${{ matrix.python }}.xml --min-tests 870 --allow-skip "PostgreSQL-only"
          --require-file .github/required-tests/common.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: "sqlite-junit-${{ matrix.python }}", path: "sqlite-junit-${{ matrix.python }}.xml", if-no-files-found: error}
  postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: dewako, POSTGRES_PASSWORD: dewako_test_pw, POSTGRES_DB: dewako}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dewako" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - name: full suite on PostgreSQL 16 (HTTP, concurrency, process-kill crash matrix, migrations); ZERO skips allowed
        working-directory: backend/tests
        timeout-minutes: 30
        env:
          DEWAKO_REQUIRE_HTTP_TESTS: "1"
          DEWAKO_REQUIRE_NODE: "1"
          DEWAKO_EXPECT_PG_MAJOR: "16"
          DEWAKO_TEST_DB: postgres
          DEWAKO_TEST_PG_URL: postgresql://dewako:dewako_test_pw@127.0.0.1:5432/dewako
          PYTHONPATH: ".."
        run: python -m pytest -q -p no:cacheprovider --timeout=300 --junitxml=../../pg-junit.xml
      - name: zero skips; every shared and PostgreSQL-only required test must have run and passed
        run: >-
          python scripts/assert_no_skips.py pg-junit.xml --min-tests 870
          --require-file .github/required-tests/common.txt --require-file .github/required-tests/postgres-only.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: pg-junit, path: pg-junit.xml, if-no-files-found: error}
  crash-repeat:
    # Order-dependence guard: the complete crash/recovery suite in three fresh processes per backend.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: dewako, POSTGRES_PASSWORD: dewako_test_pw, POSTGRES_DB: dewako}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dewako" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - name: crash/recovery suite x3 (fresh processes), SQLite then PostgreSQL 16; any failure or skip fails the job
        working-directory: backend/tests
        env:
          PYTHONPATH: ".."
          DEWAKO_EXPECT_PG_MAJOR: "16"
          DEWAKO_TEST_PG_URL: postgresql://dewako:dewako_test_pw@127.0.0.1:5432/dewako
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pytest -q -p no:cacheprovider test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py -k "not pg_" --junitxml=../../crash-sqlite-$i.xml
            DEWAKO_TEST_DB=postgres python -m pytest -q -p no:cacheprovider test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py --junitxml=../../crash-pg-$i.xml
          done
      - run: |
          set -euo pipefail
          R="--require test_a_pending_partial_exit_survives_a_kill_and_the_exchange_report_finishes_it_without_a_second_sale --require test_repeated_kill_restart_cycles_change_nothing_and_sell_nothing --require test_take_profit_is_enforced_by_a_fresh_process_after_a_kill"
          for i in 1 2 3; do
            python scripts/assert_no_skips.py crash-sqlite-$i.xml --min-tests 24 $R
            python scripts/assert_no_skips.py crash-pg-$i.xml --min-tests 27 $R
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: crash-junit, path: "crash-*.xml", if-no-files-found: error}
  windows-crash:
    # Windows has no PostgreSQL service containers: SQLite only. Exercises the Job Object cleanup and the crash matrix on Windows.
    # 3.14 is informational (continue-on-error) until its intermittent hang (run 42839151033, job cancelled at the timeout) is
    # root-caused; 3.13 is blocking. The 3.14 result is still visible on every run.
    runs-on: windows-2022
    timeout-minutes: 40
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy: {fail-fast: false, matrix: {python: ["3.13", "3.14"]}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python }}", allow-prereleases: true}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt pytest-timeout
      - name: process cleanup helper + crash matrix + crash/recovery, x3
        working-directory: backend/tests
        shell: bash
        env: {PYTHONPATH: ".."}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pytest -q -p no:cacheprovider -v --timeout=300 --timeout-method=thread -o faulthandler_timeout=240 test_process_cleanup.py test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py --junitxml=../../win-crash-$i.xml
          done
      - run: |
          foreach ($i in 1,2,3) { python scripts/assert_no_skips.py win-crash-$i.xml --min-tests 39 --allow-skip "PostgreSQL-only" --require test_a_pending_partial_exit_survives_a_kill_and_the_exchange_report_finishes_it_without_a_second_sale --require test_repeated_kill_restart_cycles_change_nothing_and_sell_nothing --require test_take_profit_is_enforced_by_a_fresh_process_after_a_kill; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: "win-crash-junit-${{ matrix.python }}", path: "win-crash-*.xml", if-no-files-found: error}
  e2e-real-app:
    # Browser end-to-end tests against the ACTUAL FastAPI app under Uvicorn (not the stand-in). The only job that verifies the dashboard end to end.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: dashboard e2e vs real FastAPI (any failed or unrecorded check, or the stand-in server, fails the job)
        env: {DEWAKO_E2E_SERVER: real, DEWAKO_E2E_REQUIRE_REAL: "1", DEWAKO_E2E_JUNIT: e2e-junit.xml, PYTHONPATH: backend}
        run: |
          set -euo pipefail
          python frontend/browser_tests/test_dashboard_browser.py | tee e2e-real.log
      - run: python scripts/assert_no_skips.py e2e-junit.xml --min-tests 16
      - name: nothing that looks like a secret is in the log or screenshots folder about to be uploaded
        if: always()
        run: python scripts/scan_secrets.py .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-real
          path: |
            e2e-real.log
            e2e-junit.xml
            frontend/browser_tests/shots
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: full suite inside the test image against PostgreSQL 16 (compose)
        run: |
          set -euo pipefail
          mkdir -p ci-out && chmod 777 ci-out
          docker compose -f docker-compose.test.yml run --rm tests
      - name: skips in the image are limited to what a backend-only image cannot run (no Node there; the UI tests run in sqlite/postgres16)
        run: >-
          python3 scripts/assert_no_skips.py ci-out/docker-pg-junit.xml --min-tests 870
          --allow-skip "backend-only image" --allow-skip "node is not installed"
          --require-file .github/required-tests/postgres-only.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: docker-junit, path: ci-out/docker-pg-junit.xml, if-no-files-found: error}
  compose-smoke:
    # The PRODUCTION image and compose file: build, start, health check, migrations, restart with state kept, graceful stop, and
    # refusal to start on a missing or invalid setting. Test values only; no exchange credentials; paper mode; nothing is deployed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/compose_smoke.sh
      - name: nothing that looks like a secret is in the container logs about to be uploaded
        if: always()
        run: python3 scripts/scan_secrets.py ci-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: {name: compose-smoke, path: ci-out/, if-no-files-found: error}
