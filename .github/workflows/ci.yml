  crash-repeat:
    # Order-dependence guard: the complete crash/recovery suite in three fresh processes per backend (in-process reorder/repeat runs were done manually, see the audit).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: dewako, POSTGRES_PASSWORD: dewako_test_pw, POSTGRES_DB: dewako}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dewako" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - name: crash/recovery suite x3 (fresh processes), SQLite then PostgreSQL 16; any failure or skip fails the job
        working-directory: backend/tests
        env:
          PYTHONPATH: ".."
          DEWAKO_EXPECT_PG_MAJOR: "16"
          DEWAKO_TEST_PG_URL: postgresql://dewako:dewako_test_pw@127.0.0.1:5432/dewako
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pytest -q -p no:cacheprovider test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py -k "not pg_" --junitxml=../../crash-sqlite-$i.xml
            DEWAKO_TEST_DB=postgres python -m pytest -q -p no:cacheprovider test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py --junitxml=../../crash-pg-$i.xml
          done
      - run: |
          set -euo pipefail
          for f in crash-sqlite-1 crash-sqlite-2 crash-sqlite-3 crash-pg-1 crash-pg-2 crash-pg-3; do python scripts/assert_no_skips.py $f.xml --min-tests 22 --require test_a_pending_partial_exit_survives_a_kill_and_the_exchange_report_finishes_it_without_a_second_sale --require test_repeated_kill_restart_cycles_change_nothing_and_sell_nothing --require test_take_profit_is_enforced_by_a_fresh_process_after_a_kill; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: crash-junit, path: "crash-*.xml"}
  windows-crash:
    # Windows has no PostgreSQL service containers: SQLite only. Exercises the Job Object cleanup and the crash matrix on Windows.
    runs-on: windows-2022
    timeout-minutes: 40
    strategy: {matrix: {python: ["3.13", "3.14"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", allow-prereleases: true}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt pytest-timeout
      - name: process cleanup helper + crash matrix + crash/recovery, x3
        working-directory: backend/tests
        shell: bash
        env: {PYTHONPATH: ".."}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pytest -q -p no:cacheprovider -v --timeout=300 --timeout-method=thread -o faulthandler_timeout=240 test_process_cleanup.py test_crash_matrix.py test_crash_and_recon.py test_stage2_wp7_lifecycle.py --junitxml=../../win-crash-$i.xml
          done
      - run: |
          foreach ($i in 1,2,3) { python scripts/assert_no_skips.py win-crash-$i.xml --min-tests 25 --allow-skip "PostgreSQL-only" --require test_a_pending_partial_exit_survives_a_kill_and_the_exchange_report_finishes_it_without_a_second_sale --require test_repeated_kill_restart_cycles_change_nothing_and_sell_nothing --require test_take_profit_is_enforced_by_a_fresh_process_after_a_kill; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: win-crash-junit, path: "win-crash-*.xml"}
  e2e-real-app:
    # Browser end-to-end tests against the ACTUAL FastAPI app under Uvicorn (not the stand-in). The only job that can verify the dashboard end to end.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: dashboard e2e vs real FastAPI (any failure fails the job)
        env: {DEWAKO_E2E_SERVER: real, PYTHONPATH: backend}
        run: |
          set -euo pipefail
          python frontend/browser_tests/test_dashboard_browser.py | tee e2e-real.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: e2e-real, path: "e2e-real.log\nfrontend/browser_tests/shots"}
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.test.yml run --rm tests
      - run: docker build -t dewako-backend backend
