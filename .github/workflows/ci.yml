# NOTE (Stage 1.1): added the seven Stage 1.1 required tests (executable-price sizing, wide-spread exits, time stop, current-state readiness).
# NOTE (Stage 1): added the Stage 1 required tests (exit monitor, SELL-while-flat, application lifecycle, HTTP lifecycle, bootstrap race) and raised --min-tests to 450.
#   THIS WORKFLOW HAS STILL NEVER BEEN EXECUTED ON A HOSTED RUNNER; no hosted result exists.
# NOTE (Phase 4.5): added the e2e-real-app job, pinned test constraints and the Phase 4.4/4.5 required tests. Executed on GitHub Actions: see docs/STAGE1_BASELINE_VERIFICATION.md for run URLs.
# NOTE: this workflow has NOT been executed by the author (no CI runner / Docker daemon / package index was available).
# It was checked structurally (YAML parse, paths, report names). The first real run is the verification of the workflow itself.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m compileall -q backend/dewako backend/tests
      - run: pip install ruff==0.6.9 pip-audit==2.7.3
      - run: ruff check backend/dewako --select E9,F63,F7,F82      # real errors only: syntax, undefined names, invalid comparisons
      - run: python scripts/scan_secrets.py
      - run: pip install -r backend/requirements.txt && pip-audit -r backend/requirements.txt
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: {python: ["3.12", "3.13"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r backend/requirements.txt -c backend/constraints-test.txt -r backend/requirements-test.txt
      - name: tests on SQLite (PostgreSQL-only tests are expected to skip here; HTTP tests must run)
        working-directory: backend/tests
        env: {DEWAKO_REQUIRE_HTTP_TESTS: "1", PYTHONPATH: ".."}
        run: python -m pytest -q -p no:cacheprovider --timeout=300 --junitxml=../../sqlite-junit.xml
      - name: only PostgreSQL-only tests may be skipped; the HTTP regressions must have run
        run: >-
          python scripts/assert_no_skips.py sqlite-junit.xml --min-tests 450 --allow-skip "PostgreSQL-only"
          --require test_logout_requires_authentication_and_is_not_a_public_route
          --require test_enable_live_returns_409_with_reasons_and_never_claims_live_is_active
          --require test_hung_worker_is_killed_by_the_controller_timeout
          --require test_auth_me_returns_identity_and_permission_names_and_requires_a_session
          --require test_ui_routes_serve_only_allowlisted_assets_with_a_strict_policy
          --require test_activity_history_requires_auth_has_the_documented_schema_and_paginates_without_duplicates
          --require test_activity_status_and_an_unknown_order_stays_unknown_across_reads
          --require test_package_upload_routes_over_http_validate_authorize_and_never_activate
          --require test_sse_stream_over_real_http_hello_events_heartbeat_resume_and_no_duplicates
          --require test_sse_stream_closes_when_the_session_is_revoked_and_caps_concurrent_streams
          --require test_sse_frames_never_leak_exception_text_when_the_backend_fails
          --require test_activity_package_is_read_only_and_cannot_reach_anything_that_acts
          --require test_ui_package_labels_match_backend_states
          --require test_stop_closes_the_position
          --require test_stop_and_take_profit_survive_sigkill_and_a_fresh_engine_enforces_them
          --require test_sell_entry_with_no_position_is_blocked_and_sends_nothing
          --require test_fill_for_a_vanished_position_opens_a_critical_incident_and_recover_completes
          --require test_enter_protected_then_exit_on_stop_then_restart_recovers_an_open_position
          --require test_create_bot_over_http_then_see_an_order_and_a_protected_position
          --require test_position_survives_an_application_restart_and_is_closed_by_its_stop
          --require test_nothing_configured_is_not_ready_over_http
          --require test_risk_limits_are_admin_changeable_validated_audited_and_report_unenforced_controls
          --require test_drawdown_from_an_unrealised_loss_blocks_a_new_entry_through_the_running_application
          --require test_concurrent_first_user_requests_create_exactly_one_admin
          --require test_unset_workers_healthy_blocks_the_gate
          --require test_an_adverse_ask_keeps_the_loss_at_the_stop_within_the_approved_risk
          --require test_a_triggered_take_profit_in_a_wide_spread_waits_is_not_reported_closed_and_is_audited_without_an_incident
